# Builds the hub for Windows and Linux and publishes them as a GitHub release.
# Run it by hand: Actions → Release → Run workflow, with the version (1.2.0, or 1.2.0-beta.1).
# The installers (scripts/install.sh, scripts/install.ps1) fetch the latest release that isn't a
# pre-release, by these file names:
#   Pucksley-windows-x64.zip       the Windows tray app (a Pucksley folder)
#   pucksley-linux-x64.tar.gz      the Linux desktop app (a pucksley folder, install.sh inside)
#   pucksley-linux-arm64.tar.gz
#   pucksley-firmware.zip          the puck's firmware (a pucksley-firmware folder: the images and flash_args,
#                                  for esptool or the flasher on pucksley.com, which fetches it from here)
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the v (1.2.0, or 1.2.0-beta.1)'
        required: true
      prerelease:
        description: 'A pre-release (the installers keep to the latest full release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check the version and run the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$VERSION\" isn't a version like 1.2.0 or 1.2.0-beta.1"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION has already been released"
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Everything that runs on Linux; the Live and Integration tests need a real desktop, speakers
      # or downloads, so they stay on developers' machines
      - name: Test
        run: dotnet test hub/Pucksley.sln -c Release --filter "Category!=Live&Category!=Integration"

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test the Windows plugins
        run: dotnet test hub/tests/Pucksley.Plugins.Windows.Tests -c Release --filter "Category!=Live&Category!=Integration"
      - name: Build
        shell: pwsh
        run: |
          dotnet publish hub/src/Hosts/Pucksley.Tray/Pucksley.Tray.csproj -c Release -r win-x64 --self-contained `
            "-p:Version=$env:VERSION" -o out/Pucksley
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path out/Pucksley -DestinationPath Pucksley-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Pucksley-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.rid }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: |
          dotnet publish hub/src/Hosts/Pucksley.Linux/Pucksley.Linux.csproj -c Release -r ${{ matrix.rid }} --self-contained \
            "-p:Version=$VERSION" -o out/pucksley
          cp scripts/install.sh out/pucksley/install.sh
          chmod +x out/pucksley/pucksley out/pucksley/install.sh
          tar -czf pucksley-${{ matrix.rid }}.tar.gz -C out pucksley
      - name: It starts
        if: matrix.rid == 'linux-x64'
        run: out/pucksley/pucksley --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: pucksley-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  firmware:
    name: Puck firmware
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: |
          sed -i -E "s/^#define PUCK_FW_VERSION \".*\"/#define PUCK_FW_VERSION \"$VERSION\"/" firmware/main/config.h
          grep -q "PUCK_FW_VERSION \"$VERSION\"" firmware/main/config.h
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware
      # The same files idf.py flashes, laid out as flash_args names them, so esptool can take
      # "write_flash @flash_args" from inside the folder
      - name: Package
        run: |
          build=firmware/build
          out=out/pucksley-firmware
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$build/bootloader/bootloader.bin" "$out/bootloader/"
          cp "$build/partition_table/partition-table.bin" "$out/partition_table/"
          cp "$build/ota_data_initial.bin" "$build/pucksley.bin" "$build/flash_args" "$out/"
          echo "$VERSION" > "$out/version.txt"
          cat "$out/flash_args"
          (cd out && zip -qr ../pucksley-firmware.zip pucksley-firmware)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: pucksley-firmware.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, linux, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          notes="Install or update in one line:

          - **Windows** (PowerShell): \`irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.ps1 | iex\`
          - **Linux**: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh | bash\`

          Or download the file below for your computer and unpack it: run \`Pucksley.exe\` on Windows, or \`./install.sh\` from the \`pucksley\` folder on Linux.

          **The puck's firmware**: flash it from the browser at https://www.pucksley.com/flash/ (Chrome or Edge, over USB), or unpack \`pucksley-firmware.zip\` and, inside the \`pucksley-firmware\` folder, run \`python -m esptool --chip esp32s3 -p <port> write_flash @flash_args\`."
          gh release create "v$VERSION" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pucksley $VERSION" --notes "$notes" --generate-notes "${flags[@]}"
